auth:
  enabled: true
  api_keys:
    - key: "dev-user-key"
      user_id: "demo-web"
      role: "user"

    - key: "dev-admin-key"
      user_id: "admin"
      role: "admin"

policy:
  max_input_chars: 2000          
  max_tokens_default: 128        
  max_tokens_admin: 256
  rate_limit_rpm_user: 10       
  rate_limit_rpm_admin: 60
  timeout_seconds: 30

backend:
  engine: "vllm"                
  model: "Qwen/Qwen2.5-1.5B-Instruct"
  embedding_model: "BAAI/bge-small-en-v1.5"