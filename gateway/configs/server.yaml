app:
  host: 0.0.0.0
  port: 8000

auth:
  enabled: false
  api_keys:
    - key: "dev-admin-key"
      user_id: "admin_user"
      role: "admin"
    - key: "dev-user-key"
      user_id: "employee_01"
      role: "user"

policy:
  max_input_chars: 8000
  max_tokens_default: 256
  max_tokens_admin: 512
  rate_limit_rpm_user: 9999
  rate_limit_rpm_admin: 9999
  timeout_seconds: 60

backend:
  engine: "vllm"
  model: "Qwen/Qwen2.5-1.5B-Instruct"
  embedding_model: "BAAI/bge-small-en-v1.5"
