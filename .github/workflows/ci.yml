name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r gateway/requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: gateway
          DISABLE_EMBEDDINGS: "1"
        run: |
          pytest -q
